engineStrict: true
saveExact: true
enableGlobalVirtualStore: false
verifyDepsBeforeRun: error
allowBuilds:
  esbuild: true
packageExtensions:
  # dependency-cruiser 18 needs the TS 6 compiler API; our build uses TS 7.
  dependency-cruiser@18.6.0:
    dependencies:
      typescript: 6.0.3
minimumReleaseAgeExclude:
  # Explicitly selected and pinned during scaffold installation.
  - zod@4.6.7
